function isValidInstagramHandle(h) {
  if (!h) return false;
  const s = h.replace(/^@/,"").trim();
  return s.length>=1 && s.length<=30 && /^[a-zA-Z0-9._]+$/.test(s) && !s.startsWith(".") && !s.endsWith(".") && !s.includes("..");
}

function FOLLOLogo({ size = 120 }) {
  const glow = size * 0.22;
  return (
    <div style={{ display:"flex", flexDirection:"column", alignItems:"center" }}>
      <div style={{
        width: size, height: size,
        borderRadius: size * 0.22,
        boxShadow: [
          `0 0 ${glow*1.5}px ${glow*0.6}px rgba(30,120,255,0.7)`,
          `0 0 ${glow*3}px ${glow*1.2}px rgba(10,60,220,0.35)`,
        ].join(", "),
        overflow: "hidden",
        position: "relative",
      }}>
        <img src={FOLLO_LOGO} alt="FOLLO" style={{ width:"100%", height:"100%", objectFit:"cover", display:"block" }}/>
      </div>
    </div>
  );
}

function SmallFLogo({ size = 32 }) {
  const glow = size * 0.3;
  return (
    <div style={{
      width: size, height: size,
      borderRadius: size * 0.22,
      boxShadow: `0 0 ${glow*1.5}px ${glow*0.6}px rgba(30,120,255,0.65)`,
      flexShrink: 0,
      overflow: "hidden",
      position: "relative",
    }}>
      <img src={FOLLO_LOGO} alt="FOLLO" style={{ width:"100%", height:"100%", objectFit:"cover", display:"block" }}/>
    </div>
  );
}

function OnboardingScreen({ t, onboardIdx, setOnboardIdx, updateUser, setStage }) {

        <GradientButton disabled={!newMemberName.trim()||!newMemberEmail.trim()} onClick={()=>{const h=newMemberHandle.trim().replace("@","");if(h&&!isValidInstagramHandle(h)){showToast(t.igHandleInvalid);return;}const k=newMemberEmail.trim().toLowerCase();setUsersDB(db=>{const n={...db,[k]:{email:newMemberEmail.trim(),password:"",name:newMemberName.trim(),instagramHandle:h,avatar:null,coins:0,lifetimeCoins:0,stars:5,role:"member",strikes:0,online:false,onboarded:true,confirmedCampaigns:[],followedAdmin:false}};broadcast("users",n);return n;});setNewMemberName("");setNewMemberEmail("");setNewMemberHandle("");showToast(t.addToast);}} style={{width:"100%",padding:"10px",fontSize:13}}>{t.addBtn}</GradientButton>

      {members.length===0&&<EmptyState icon={<Users size={26} color="#6E6A78"></Users>} text={t.noMembers}/>}

              <div style={{flex:1}}>

                <div style={{color:"#6E6A78",fontSize:11}}>{m.email}{m.instagramHandle&&` · @${m.instagramHandle}`}</div>
                <div style={{display:"flex",alignItems:"center",gap:8,marginTop:3}}><CoinPill value={m.coins} small></CoinPill><span style={{display:"flex",alignItems:"center",gap:3,color:"#FFCB4D",fontSize:11}}><Star size={11} color="#FFCB4D"></Star>{m.stars??5}</span>{m.strikes>0&&<span style={{display:"flex",alignItems:"center",gap:3,color:"#FF5C5C",fontSize:11}}><AlertTriangle size={11}></AlertTriangle>{m.strikes}</span>}</div>
              </div>
            </div>
            <div style={{display:"flex",gap:8,marginBottom:8}}>
              <select value={m.role} onChange={e=>setUsersDB(db=>{const n={...db,[m.email.toLowerCase()]:{...db[m.email.toLowerCase()],role:e.target.value}};broadcast("users",n);return n;})} style={{flex:1,background:"#1A1F2C",color:"#F6F4F2",border:"1px solid #33394A",borderRadius:8,fontSize:11,padding:"6px 8px"}}><option value="member">{t.roleMember}</option><option value="admin">{t.roleAdmin}</option></select>
              <button onClick={()=>{if(window.confirm(t.deleteConfirm.replace("{name}",m.name))){setUsersDB(db=>{const n={...db};delete n[m.email.toLowerCase()];broadcast("users",n);return n;});showToast(t.deleteToast);}}} style={{display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,92,92,0.1)",border:"1px solid rgba(255,92,92,0.3)",borderRadius:8,color:"#FF5C5C",padding:"6px 10px",cursor:"pointer"}}><Trash2 size={13}></Trash2></button>
            </div>
            <div style={{display:"flex",gap:8}}>
              <input value={giftAmounts[m.email]??""} onChange={e=>setGiftAmounts(g=>({...g,[m.email]:e.target.value.replace(/\D/g,"")}))} placeholder={t.giftAmountPlaceholder} style={{flex:1,background:"#1A1F2C",color:"#F6F4F2",border:"1px solid #33394A",borderRadius:8,fontSize:11,padding:"6px 8px"}}/>
              <button onClick={()=>{const a=parseInt(giftAmounts[m.email],10);if(!a||a<=0)return;setUsersDB(db=>{const n={...db,[m.email.toLowerCase()]:{...db[m.email.toLowerCase()],coins:(db[m.email.toLowerCase()].coins||0)+a}};broadcast("users",n);return n;});setGiftAmounts(g=>({...g,[m.email]:""}));showToast(t.giftToast);}} style={{display:"flex",alignItems:"center",gap:4,background:"rgba(255,201,77,0.12)",border:"1px solid rgba(255,201,77,0.3)",borderRadius:8,color:"#FFCB4D",fontSize:11,fontWeight:600,padding:"6px 10px",cursor:"pointer",whiteSpace:"nowrap"}}><Gift size={12}></Gift>{t.giftCoins}</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  const { t,lang,user,tab,setTab,setLang,toast,usersDB,setUsersDB,campaigns,members,promoteSpeed,setPromoteSpeed,promoteHandle,setPromoteHandle,promoteCount,setPromoteCount,promoteCost,earnList,myCampaigns,editEmail,setEditEmail,editPassword,setEditPassword,showEditPassword,setShowEditPassword,giftAmounts,setGiftAmounts,newMemberName,setNewMemberName,newMemberEmail,setNewMemberEmail,newMemberHandle,setNewMemberHandle,broadcast,updateUser,confirmFollow,submitPromote,verifyConfirmer,handleSave,showToast,ALL_LANGUAGES,onSwitchAccount,onLogout,onReset } = props;

          {[0,1].map(i=><div key={i} style={{display:"flex",width:"50%",justifyContent:"space-around"}}><span>🪙 +10 EARNED</span><span>📈 NEW CAMPAIGN</span><span>✅ FOLLOW CONFIRMED</span><span>🚩 REPORT RESOLVED</span><span>⭐ RATING UPDATED</span></div>)}

      </div>

function EarnTab({ t, earnList, user, confirmFollow }) {
  return (
    <div>
      <div style={{fontSize:19,fontWeight:700,marginBottom:2}}>{t.earnTitle}</div>
      <div style={{color:"#A9A5B0",fontSize:13,marginBottom:18}}>{t.earnSub}</div>
      {earnList.length===0&&<EmptyState icon={<Users size={26} color="#6E6A78"></Users>} text={t.emptyEarn}/>}
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {earnList.map(c=>{
          const done=user.confirmedCampaigns.includes(c.id);
          return (
            <div key={c.id} style={{background:"#121620",border:"1px solid #232838",borderRadius:16,padding:16}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                <div style={{width:40,height:40,borderRadius:"50%",overflow:"hidden",flexShrink:0}}><img src={FOLLO_LOGO} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/></div>
                <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>@{c.handle}</div><div style={{color:"#6E6A78",fontSize:12}}>{c.confirmers.length} {t.of} {c.target} {t.followers}</div></div>
                <Bolts n={SPEED_META[c.speed].bolts}></Bolts>
              </div>
              <div style={{height:5,background:"#1A1F2C",borderRadius:4,overflow:"hidden",marginBottom:12}}>
                <div style={{height:"100%",width:`${Math.min(100,(c.confirmers.length/c.target)*100)}%`,background:"linear-gradient(90deg,#00E5A0,#7C5CFF)"}}></div>
              </div>
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>window.open(`https://instagram.com/${c.handle}`,"_blank")} style={{flex:1,padding:"10px",borderRadius:10,border:"1px solid #33394A",background:"transparent",color:"#F6F4F2",fontSize:13,fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center",gap:6,cursor:"pointer"}}><Instagram size={14}></Instagram>{t.openInstagram}</button>
                <GradientButton onClick={()=>confirmFollow(c.id)} disabled={done} style={{flex:1,padding:"10px",fontSize:13}}>{done?t.confirmed:`${t.confirmBtn} ${t.reward}`}</GradientButton>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PromoteTab({ t, promoteHandle, setPromoteHandle, promoteSpeed, setPromoteSpeed, promoteCount, setPromoteCount, promoteCost, user, submitPromote }) {
  return (
    <div>
      <div style={{fontSize:19,fontWeight:700,marginBottom:2}}>{t.promoteTitle}</div>
      <div style={{color:"#A9A5B0",fontSize:13,marginBottom:18}}>{t.promoteSub}</div>
      <input value={promoteHandle} onChange={e=>setPromoteHandle(e.target.value)} placeholder={t.yourHandle} style={{width:"100%",background:"#121620",border:"1px solid #232838",borderRadius:12,padding:"14px",color:"#F6F4F2",fontSize:14,outline:"none",boxSizing:"border-box",marginBottom:16}}/>
      <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:18}}>
        {["normal","fast","ultra"].map(sp=>(
          <button key={sp} onClick={()=>setPromoteSpeed(sp)} style={{textAlign:"start",padding:"14px 16px",borderRadius:14,border:promoteSpeed===sp?"2px solid #00E5A0":"1px solid #232838",background:promoteSpeed===sp?"rgba(0,229,160,0.08)":"#121620",cursor:"pointer",color:"#F6F4F2"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}><span style={{fontWeight:700,fontSize:14}}>{t[`speed${sp[0].toUpperCase()}${sp.slice(1)}`]}</span><Bolts n={SPEED_META[sp].bolts}></Bolts></div>
            <div style={{color:"#8B8891",fontSize:12}}>{t[`speed${sp[0].toUpperCase()}${sp.slice(1)}Desc`]}</div>
          </button>
        ))}
      </div>
      <div style={{marginBottom:8,fontSize:13,color:"#A9A5B0"}}>{t.followerCount}</div>
      <div style={{display:"flex",gap:8,marginBottom:18}}>
        {[100,200,300].map(n=><button key={n} onClick={()=>setPromoteCount(n)} style={{flex:1,padding:"12px",borderRadius:12,border:promoteCount===n?"2px solid #7C5CFF":"1px solid #232838",background:promoteCount===n?"rgba(124,92,255,0.1)":"#121620",color:"#F6F4F2",fontWeight:700,cursor:"pointer"}}>{n}</button>)}
      </div>
      <div style={{background:"#121620",border:"1px solid #232838",borderRadius:14,padding:16,marginBottom:18,display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{color:"#A9A5B0",fontSize:13}}>{t.totalCost}</span><CoinPill value={user.isAdmin?t.unlimited:promoteCost} small></CoinPill></div>
      <GradientButton onClick={submitPromote} disabled={!promoteHandle.trim()} style={{width:"100%"}}>{t.submitPromote}</GradientButton>
    </div>
  );
}

function ComplaintsTab({ t, lang, myCampaigns, verifyConfirmer }) {
  return (
    <div>
      <div style={{fontSize:19,fontWeight:700,marginBottom:2}}>{t.complaintsTitle}</div>
      <div style={{color:"#A9A5B0",fontSize:13,marginBottom:18}}>{t.complaintsSub}</div>
      {myCampaigns.length===0&&<EmptyState icon={<Flag size={26} color="#6E6A78"></Flag>} text={t.noOwnCampaign} sub={t.noOwnCampaignBody}/>}
      {myCampaigns.map(c=>(
        <div key={c.id} style={{marginBottom:18}}>
          <div style={{fontSize:13,color:"#8B8891",marginBottom:8}}>@{c.handle} · {c.confirmers.length} {t.of} {c.target}</div>
          {c.confirmers.length===0&&<div style={{color:"#6E6A78",fontSize:13,padding:"12px 0"}}>—</div>}
          {c.confirmers.map(cf=>(
            <div key={cf.id} style={{background:"#121620",border:"1px solid #232838",borderRadius:14,padding:14,marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:cf.status==="pending"?12:0}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:34,height:34,borderRadius:"50%",overflow:"hidden",flexShrink:0}}><img src={FOLLO_LOGO} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/></div>
                  <div>
                    <button onClick={()=>cf.instagramHandle&&openInstagramProfile(cf.instagramHandle)} style={{background:"none",border:"none",padding:0,cursor:cf.instagramHandle?"pointer":"default",color:"#F6F4F2",fontWeight:700,fontSize:14,display:"flex",alignItems:"center",gap:4}}>{cf.instagramHandle?`@${cf.instagramHandle}`:(lang==="ar"?"بلا حساب":"No IG")}{cf.instagramHandle&&<Instagram size={12} color="#38b6ff"></Instagram>}</button>
                    <div style={{color:"#6E6A78",fontSize:11}}>{cf.name}</div>
                  </div>
                </div>
                {cf.status==="verified"&&<span style={{color:"#33D17A",fontSize:12,fontWeight:600}}>{t.verifiedTag}</span>}
                {cf.status==="reported"&&<span style={{color:"#FF5C5C",fontSize:12,fontWeight:600}}>{t.reportedTag}</span>}
              </div>
              {cf.status==="pending"&&<div style={{display:"flex",gap:8}}><button onClick={()=>verifyConfirmer(c.id,cf.id,true)} style={{flex:1,padding:"9px",borderRadius:10,border:"1px solid #33D17A55",background:"rgba(51,209,122,0.1)",color:"#33D17A",fontWeight:600,fontSize:12,cursor:"pointer"}}>{t.legitBtn}</button><button onClick={()=>verifyConfirmer(c.id,cf.id,false)} style={{flex:1,padding:"9px",borderRadius:10,border:"1px solid #FF5C5C55",background:"rgba(255,92,92,0.1)",color:"#FF5C5C",fontWeight:600,fontSize:12,cursor:"pointer"}}>{t.reportBtn}</button></div>}
            </div>
          ))}
        </div>
      ))}
      <div style={{textAlign:"center",marginTop:30,marginBottom:20}}><SmallFLogo size={50}></SmallFLogo></div>
    </div>
  );
}


// ===== App.jsx =====
function App() {
  const [stage, setStage] = useState("splash");
  const [lang, setLang] = useState("ar");
  const t = STRINGS[lang] || STRINGS.en;
  const [form, setForm] = useState({ email: "", password: "" });
  const [showLoginPassword, setShowLoginPassword] = useState(false);
  const [authMode, setAuthMode] = useState("login");
  const [authError, setAuthError] = useState("");
  const [signupName, setSignupName] = useState("");
  const [signupEmail, setSignupEmail] = useState("");
  const [signupPassword, setSignupPassword] = useState("");
  const [signupConfirm, setSignupConfirm] = useState("");
  const [signupInstagram, setSignupInstagram] = useState("");
  const [showSignupPassword, setShowSignupPassword] = useState(false);
  const [onboardIdx, setOnboardIdx] = useState(0);
  const [user, setUser] = useState(null);
  const [tab, setTab] = useState("earn");
  const [usersDB, setUsersDB] = useState(() => loadUsersDB());
  const [campaigns, setCampaigns] = useState(() => loadCampaignsDB());
  const [newMemberName, setNewMemberName] = useState("");
  const [newMemberEmail, setNewMemberEmail] = useState("");
  const [newMemberHandle, setNewMemberHandle] = useState("");
  const [giftAmounts, setGiftAmounts] = useState({});
  const [editEmail, setEditEmail] = useState("");
  const [editPassword, setEditPassword] = useState("");
  const [showEditPassword, setShowEditPassword] = useState(false);
  const [toast, setToast] = useState("");
  const [promoteSpeed, setPromoteSpeed] = useState("normal");
  const [promoteHandle, setPromoteHandle] = useState("");
  const [promoteCount, setPromoteCount] = useState(100);
  const promoteCost = Math.round(SPEED_META[promoteSpeed].cost * (promoteCount / 100));

  const members = (() => {
    const map = new Map();
    Object.values(usersDB).forEach(m => {
      if (!m.email) return;
      const k = m.email.toLowerCase();
      if (k === user?.email?.toLowerCase()) return;
      if (!map.has(k)) map.set(k, m);
    });
    return Array.from(map.values());
  })();

  const showToast = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(""), 2400); }, []);

  useEffect(() => { saveUsersDB(usersDB); }, [usersDB]);
  useEffect(() => { saveCampaignsDB(campaigns); }, [campaigns]);

  const bcRef = useRef(null);
  useEffect(() => {
    if (typeof BroadcastChannel !== "undefined") {
      bcRef.current = new BroadcastChannel("follo_sync");
      bcRef.current.onmessage = ({ data: { type, data } }) => {
        if (type === "users") setUsersDB(data);
        else if (type === "campaigns") setCampaigns(data);
      };
      return () => bcRef.current?.close();
    }
  }, []);

  const broadcast = useCallback((type, data) => { bcRef.current?.postMessage({ type, data }); }, []);

  const updateUser = useCallback((patch) => {
    setUser(prev => {
      if (!prev) return prev;
      const next = typeof patch === "function" ? patch(prev) : { ...prev, ...patch };
      setUsersDB(db => { const n = { ...db, [next.email.toLowerCase()]: next }; broadcast("users", n); return n; });
      return next;
    });
  }, [broadcast]);

  const handleLogin = () => {
    const emailKey = form.email.trim().toLowerCase();
    if (!emailKey.includes("@") || form.password.length < 4) { setAuthError(lang === "ar" ? "أدخل بريداً صحيحاً وكلمة مرور 4 أحرف فأكثر" : "Enter valid email + password (4+ chars)"); return; }
    const isAdmin = emailKey === ADMIN_EMAIL && form.password === ADMIN_PASSWORD;
    const existing = usersDB[emailKey];
    if (!existing && !isAdmin) { setAuthError(lang === "ar" ? "لا يوجد حساب بهذا البريد." : "No account with this email."); return; }
    if (existing && !isAdmin && existing.password && form.password !== existing.password) { setAuthError(lang === "ar" ? "كلمة المرور غير صحيحة" : "Wrong password"); return; }
    const merged = existing
      ? { ...existing, isAdmin, role: isAdmin ? "admin" : existing.role, coins: isAdmin ? Infinity : existing.coins, lifetimeCoins: isAdmin ? Infinity : existing.lifetimeCoins, online: true, followedAdmin: isAdmin ? true : existing.followedAdmin }
      : { email: ADMIN_EMAIL, password: ADMIN_PASSWORD, name: "FOLLO Admin", avatar: null, coins: Infinity, lifetimeCoins: Infinity, stars: 5, isAdmin: true, role: "admin", instagramHandle: ADMIN_INSTAGRAM, strikes: 0, online: true, followedAdmin: true, onboarded: true, confirmedCampaigns: [] };
    setUser(merged);
    setUsersDB(db => { const n = { ...db, [emailKey]: merged }; broadcast("users", n); return n; });
    saveLastSession(emailKey);
    setAuthError("");
    if (!merged.followedAdmin) { setStage("followGate"); return; }
    setStage(merged.onboarded ? "app" : "onboarding");
  };

  const handleSignup = () => {
    if (!signupName.trim()) { setAuthError(lang === "ar" ? "أدخل اسمك" : "Enter your name"); return; }
    if (!signupEmail.includes("@")) { setAuthError(lang === "ar" ? "بريد غير صحيح" : "Invalid email"); return; }
    if (signupPassword.length < 4) { setAuthError(lang === "ar" ? "كلمة المرور 4 أحرف فأكثر" : "Password 4+ chars"); return; }
    if (signupPassword !== signupConfirm) { setAuthError(lang === "ar" ? "كلمتا المرور غير متطابقتين" : "Passwords don't match"); return; }
    const emailKey = signupEmail.trim().toLowerCase();
    const isAdmin = emailKey === ADMIN_EMAIL && signupPassword === ADMIN_PASSWORD;
    const igHandle = signupInstagram.replace("@", "").trim();
    if (!isAdmin) { if (!igHandle) { setAuthError(lang === "ar" ? "أدخل حسابك على انستقرام" : "Enter Instagram handle"); return; } if (!isValidInstagramHandle(igHandle)) { setAuthError(t.igHandleInvalid); return; } }
    if (usersDB[emailKey]) { setAuthError(lang === "ar" ? "هذا البريد مستخدم من قبل." : "Email already used."); return; }
    const fresh = { email: signupEmail.trim(), password: signupPassword, name: signupName.trim(), avatar: null, coins: isAdmin ? Infinity : 250, lifetimeCoins: isAdmin ? Infinity : 250, stars: 5, isAdmin, role: isAdmin ? "admin" : "member", instagramHandle: isAdmin ? ADMIN_INSTAGRAM : igHandle, strikes: 0, online: true, followedAdmin: isAdmin, onboarded: isAdmin, confirmedCampaigns: [] };
    setUser(fresh);
    setUsersDB(db => { const n = { ...db, [emailKey]: fresh }; broadcast("users", n); return n; });
    saveLastSession(emailKey);
    setAuthError("");
    setStage("followGate");
  };

  const confirmFollow = (campaignId) => {
    const c = campaigns.find(c => c.id === campaignId);
    if (!c || c.confirmers.length >= c.target) return;
    const hk = c.handle.toLowerCase();
    if (user.confirmedHandles?.includes(hk)) return;
    updateUser(u => { if (u.confirmedCampaigns.includes(campaignId)) return u; return { ...u, coins: u.coins + 10, lifetimeCoins: u.lifetimeCoins + 10, confirmedCampaigns: [...u.confirmedCampaigns, campaignId], confirmedHandles: [...(u.confirmedHandles || []), hk] }; });
    setCampaigns(cs => { const n = cs.map(c => c.id === campaignId ? { ...c, confirmers: [...c.confirmers, { id: user.email, name: user.name, instagramHandle: user.instagramHandle, status: "pending" }] } : c); broadcast("campaigns", n); return n; });
    showToast(lang === "ar" ? "+10 عملات! تم تأكيد المتابعة" : "+10 coins! Follow confirmed");
  };

  const submitPromote = () => {
    if (!promoteHandle.trim() || !isValidInstagramHandle(promoteHandle)) { showToast(t.igHandleInvalid); return; }
    if (!user.isAdmin && user.coins < promoteCost) { showToast(t.notEnoughCoins); return; }
    updateUser(u => ({ ...u, coins: u.isAdmin ? u.coins : u.coins - promoteCost }));
    const nc = { id: "u" + Date.now(), ownerName: user.name, ownerInitial: user.name[0]?.toUpperCase(), handle: promoteHandle.replace("@", ""), speed: promoteSpeed, target: promoteCount, confirmers: [], createdAt: Date.now() };
    setCampaigns(cs => { const n = [nc, ...cs]; broadcast("campaigns", n); return n; });
    setPromoteHandle("");
    showToast(t.promoteSuccess);
    setTab("earn");
  };

  const verifyConfirmer = (campaignId, confId, verified) => {
    setCampaigns(cs => { const n = cs.map(c => c.id !== campaignId ? c : { ...c, confirmers: c.confirmers.map(cf => cf.id === confId ? { ...cf, status: verified ? "verified" : "reported" } : cf) }); broadcast("campaigns", n); return n; });
    const k = confId.toLowerCase(), rec = usersDB[k];
    if (!rec) { showToast(verified ? t.verifyToast : t.reportToast.replace("{n}", "?")); return; }
    if (verified) { setUsersDB(db => { const n = { ...db, [k]: { ...db[k], stars: (db[k].stars || 0) + 1 } }; broadcast("users", n); return n; }); showToast(t.verifyToast); }
    else {
      const strikes = (rec.strikes || 0) + 1;
      if (strikes >= 3) { setUsersDB(db => { const n = { ...db }; delete n[k]; broadcast("users", n); return n; }); showToast(t.autoDeleteToast.replace("{name}", rec.name)); }
      else { setUsersDB(db => { const n = { ...db, [k]: { ...db[k], coins: Math.max(0, (db[k].coins || 0) - 100), strikes } }; broadcast("users", n); return n; }); showToast(t.reportToast.replace("{n}", strikes)); }
    }
  };

  const handleSave = () => {
    const ne = editEmail.trim() || user.email;
    const np = editPassword || user.password;
    const ok = user.email.toLowerCase(), nk = ne.toLowerCase();
    const updated = { ...user, email: ne, password: np };
    setUsersDB(db => { const n = { ...db }; if (ok !== nk) delete n[ok]; n[nk] = updated; broadcast("users", n); return n; });
    setUser(updated); saveLastSession(nk);
    setEditEmail(""); setEditPassword("");
    showToast(t.savedToast);
  };

  const onSwitchAccount = () => { updateUser({ online: false }); clearLastSession(); setStage("login"); setUser(null); setForm({ email: "", password: "" }); };
  const onLogout = onSwitchAccount;
  const onReset = () => { if (window.confirm(t.resetConfirm)) { ["follo_users_db","follo_campaigns_db","follo_last_session"].forEach(k => { try { localStorage.removeItem(k); } catch {} }); window.location.reload(); } };

  const speedRank = { ultra: 3, fast: 2, normal: 1 };
  const earnList = campaigns.filter(c => c.ownerName !== user?.name && c.confirmers.length < c.target && !user?.confirmedHandles?.includes(c.handle.toLowerCase())).sort((a, b) => speedRank[b.speed] - speedRank[a.speed] || b.createdAt - a.createdAt);
  const myCampaigns = campaigns.filter(c => c.ownerName === user?.name);

  // Auto-login from saved session
  useEffect(() => {
    if (stage !== "splash") return;
    const timer = setTimeout(() => {
      const lk = loadLastSession();
      const saved = lk ? usersDB[lk] : null;
      if (saved) {
        const isAdm = lk === ADMIN_EMAIL && saved.role === "admin";
        const restored = { ...saved, isAdmin: isAdm, coins: isAdm ? Infinity : saved.coins, lifetimeCoins: isAdm ? Infinity : saved.lifetimeCoins };
        setUser(restored);
        if (!restored.followedAdmin) { setStage("followGate"); return; }
        setStage(restored.onboarded ? "app" : "onboarding");
      } else setStage("login");
    }, 1800);
    return () => clearTimeout(timer);
  }, [stage]);

  if (stage === "splash") return <SplashScreen t={t} onUseAnother={() => setStage("login")}/>;
  if (stage === "followGate") return (
    <FollowGate t={t} ADMIN_INSTAGRAM={ADMIN_INSTAGRAM}
      onOpenInstagram={() => { window.open(`https://instagram.com/${ADMIN_INSTAGRAM}`, "_blank"); }}
      onConfirm={() => { updateUser({ followedAdmin: true }); setStage(user.onboarded ? "app" : "onboarding"); }}
      onBack={() => { clearLastSession(); setUser(null); setStage("login"); setForm({ email: "", password: "" }); }}
    />
  );
  if (stage === "login") return (
    <LoginScreen t={t} lang={lang} authMode={authMode} setAuthMode={setAuthMode} form={form} setForm={setForm}
      showLoginPassword={showLoginPassword} setShowLoginPassword={setShowLoginPassword}
      authError={authError} setAuthError={setAuthError} handleLogin={handleLogin}
      signupName={signupName} setSignupName={setSignupName} signupEmail={signupEmail} setSignupEmail={setSignupEmail}
      signupPassword={signupPassword} setSignupPassword={setSignupPassword} signupConfirm={signupConfirm} setSignupConfirm={setSignupConfirm}
      signupInstagram={signupInstagram} setSignupInstagram={setSignupInstagram}
      showSignupPassword={showSignupPassword} setShowSignupPassword={setShowSignupPassword}
      handleSignup={handleSignup}
      onReset={() => { ["follo_users_db","follo_campaigns_db","follo_last_session"].forEach(k => { try { localStorage.removeItem(k); } catch {} }); window.location.reload(); }}
    />
  );
  if (stage === "onboarding") return <OnboardingScreen t={t} onboardIdx={onboardIdx} setOnboardIdx={setOnboardIdx} updateUser={updateUser} setStage={setStage}></OnboardingScreen>;
  if (stage === "app" && user) return (
    <MainApp t={t} lang={lang} user={user} tab={tab} setTab={setTab} setLang={setLang} toast={toast}
      usersDB={usersDB} setUsersDB={setUsersDB} campaigns={campaigns}
      members={members} promoteSpeed={promoteSpeed} setPromoteSpeed={setPromoteSpeed}
      promoteHandle={promoteHandle} setPromoteHandle={setPromoteHandle}
      promoteCount={promoteCount} setPromoteCount={setPromoteCount} promoteCost={promoteCost}
      earnList={earnList} myCampaigns={myCampaigns}
      editEmail={editEmail} setEditEmail={setEditEmail}
      editPassword={editPassword} setEditPassword={setEditPassword}
      showEditPassword={showEditPassword} setShowEditPassword={setShowEditPassword}
      giftAmounts={giftAmounts} setGiftAmounts={setGiftAmounts}
      newMemberName={newMemberName} setNewMemberName={setNewMemberName}
      newMemberEmail={newMemberEmail} setNewMemberEmail={setNewMemberEmail}
      newMemberHandle={newMemberHandle} setNewMemberHandle={setNewMemberHandle}
      broadcast={broadcast} updateUser={updateUser}
      confirmFollow={confirmFollow} submitPromote={submitPromote} verifyConfirmer={verifyConfirmer}
      handleSave={handleSave} showToast={showToast} ALL_LANGUAGES={ALL_LANGUAGES}
      onSwitchAccount={onSwitchAccount} onLogout={onLogout} onReset={onReset}
    ></MainApp>
  );
  return null;
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<StrictMode><App ></App></StrictMode>);
</script>
</body>
</html>
